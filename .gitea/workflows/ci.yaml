name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: Test
        run: go test -race ./...

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...

      - uses: ./.gitea/actions/nix
        with:
          builder-key: ${{ secrets.NIX_REMOTE_BUILDER_KEY }}

      - name: Go modules match vendorHash
        run: nix build --no-link .#tmt.goModules
